name: LogicBridge
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    LOGIC_BRIDGE_DONATION_URL: "https://buy.stripe.com/4gM28jeOoeAweYWfyBgbm0a"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  LogicBridge:
    type: application
    platform: macOS
    sources:
      - path: Registration
        excludes: [Info.plist]
      - path: Demo
        type: folder
        buildPhase: resources
    info:
      path: Registration/Info.plist
      properties:
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: Logic Bridge OAuth
            CFBundleURLSchemes: [com.local.logicbridge.audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.logicbridge.audio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "4"
    dependencies:
      - target: StemGenerator
        embed: true
  StemGenerator:
    type: app-extension
    platform: macOS
    sources:
      - path: Plugin
        excludes: [Info.plist, StemGenerator.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.logicbridge.audio.stemgenerator
        INFOPLIST_FILE: Plugin/Info.plist
        CODE_SIGN_ENTITLEMENTS: Plugin/StemGenerator.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Plugin/Audio/StemRender.h
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "4"
schemes:
  LogicBridge:
    build:
      targets:
        LogicBridge: all
